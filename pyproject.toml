[project]
name = "pet-immich"
version = "0.1.0"
requires-python = ">=3.14"
description = "Local pet identity recognition for Immich"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "onnxruntime>=1.31.0",
    "filelock>=4.2.4",
    "torch>=2.14.1",
]

[project.optional-dependencies]
vision = [
    "ultralytics>=8.4.182",
    "ai-edge-litert>=2.3.0",
    "transformers>=5.20.2",
    "onnx>=1.23.2",
    "torchvision>=0.29.1",
]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-mock>=3.17.0"]
dev = ["ruff>=0.17.1", "ty>=0.0.89", "pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-mock>=3.17.0", "mdformat>=1.0.0"]

[project.scripts]
pet-immich = "pet_immich.cli:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    "DOC", # Docstrings explain constraints without repeating signatures.
    "CPY", # This project does not require copyright notices.
    "incorrect-blank-line-before-class", # Use D211's class spacing.
    "multi-line-summary-second-line", # Use D212's summary placement.
    "missing-trailing-comma", # The formatter controls trailing commas.
    "single-line-implicit-string-concatenation", # The formatter controls string layout.
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "assert", "implicit-namespace-package", "magic-value-comparison"]
[tool.ruff.lint.pylint]
max-args = 7
max-positional-args = 7
[tool.ruff.format]
preview = true
docstring-code-format = true
[tool.coverage.run]
branch = true
source = ["pet_immich", "tests"]
patch = ["subprocess"]
[tool.coverage.paths]
source = ["src/pet_immich", ".tox/*/lib/python*/site-packages/pet_immich", ".tox/*/Lib/site-packages/pet_immich"]
[tool.coverage.report]
fail_under = 100
show_missing = true
[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
