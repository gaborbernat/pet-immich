env_list = ["test", "type", "lint"]

[env_run_base]
base_python = ["3.14"]
set_env = { OPENBLAS_NUM_THREADS = "2", OMP_NUM_THREADS = "2" }
pass_env = ["UV_*", "PET_TEST_STATE"]

[env.test]
extras = ["test", "vision"]
commands = [["pytest", "--cov", "--cov-report=term-missing", "{posargs:tests}"]]

[env.dev]
package = "editable"
extras = ["dev", "vision"]

[env.type]
extras = ["dev", "vision"]
commands = [["ty", "check", "src", "tests", "--python", "{env_python}", "--error-on-warning"]]

[env.lint]
extras = ["dev"]
commands = [["ruff", "format", "--check", "."], ["ruff", "check", "."]]
